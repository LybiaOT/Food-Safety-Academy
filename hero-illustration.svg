<svg xmlns="http://www.w3.org/2000/svg" width="680" height="650" viewBox="0 0 680 650" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Alimentos seguros y calidad</title><desc id="desc">Ilustración moderna de alimentos frescos en un plato con insignia de calidad y pequeñas hojas alrededor.</desc>
<defs>
